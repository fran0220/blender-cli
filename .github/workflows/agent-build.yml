name: Agent build implementation
on:
  workflow_call:
    inputs:
      full:
        required: true
        type: boolean
      platforms:
        type: string
        default: '["macos_arm64","windows_x64","linux_x64"]'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ inputs.full && 'full' || 'gate' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'macos_arm64' && 'macos-15' || matrix.platform == 'windows_x64' && 'windows-2022' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pinned library revision
        id: lib
        run: echo "revision=$(git rev-parse HEAD:lib/${{ matrix.platform }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            lib/${{ matrix.platform }}
            .git/modules/lib/${{ matrix.platform }}
          key: libraries-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}
      - name: Fetch upstream assets and pinned libraries
        run: |
          git lfs install --local
          git config remote.lfs-fallback.url https://projects.blender.org/blender/blender.git
          git config remote.lfs-fallback.pushurl no_push
          git lfs pull lfs-fallback
          git -c submodule.lib/${{ matrix.platform }}.update=checkout submodule update --init --depth 1 -- lib/${{ matrix.platform }}
          git -C lib/${{ matrix.platform }} lfs pull
          test "$(git -C lib/${{ matrix.platform }} rev-parse HEAD)" = '${{ steps.lib.outputs.revision }}'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols libdbus-1-dev libgl-dev libegl-dev mesa-vulkan-drivers zstd
          echo CC=gcc-14 >> "$GITHUB_ENV"
          echo CXX=g++-14 >> "$GITHUB_ENV"
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install ninja zstd
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
          # Upstream requires MSVC >= 19.44.35216; CUDA 12.8 needs VS 2022.
          toolset: '14.44'
      - name: Windows production GPU toolchains
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Match upstream versions.cmake and windows/vmprep.cmd.txt. Install SDKs
          # on gate runs too: configuration must not silently drop GPU backends.
          $versions = Get-Content build_files/build_environment/cmake/versions.cmake -Raw
          if ($versions -notmatch 'set\(RELEASE_CUDA_VERSION 12\.8\)' -or
              $versions -notmatch 'set\(RELEASE_HIP_WINDOWS_VERSION 7\.1\)') {
            throw 'Upstream GPU compiler versions changed; update the CI SDK pins'
          }
          $sdk = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\agent-gpu-sdk").FullName
          function Assert-VendorSignature($path, $vendor) {
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch $vendor) {
              throw "Invalid vendor signature: $path"
            }
          }
          # NVIDIA documents -s <subpackages> -n for unattended/no-reboot install.
          # No display driver is needed to compile kernels on the hosted runner.
          # https://docs.nvidia.com/cuda/archive/12.8.0/cuda-installation-guide-microsoft-windows/
          $cudaInstaller = Join-Path $sdk 'cuda.exe'
          Invoke-WebRequest 'https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe' -OutFile $cudaInstaller
          # Vendor checksum: compute/cuda/12.8.0/docs/sidebar/md5sum.txt.
          if ((Get-FileHash $cudaInstaller -Algorithm MD5).Hash -ne '5e7fe0f087d65fae4c0278f13af55c1d') {
            throw 'CUDA installer checksum mismatch'
          }
          Assert-VendorSignature $cudaInstaller 'NVIDIA Corporation'
          $process = Start-Process $cudaInstaller -ArgumentList '-s','nvcc_12.8','cudart_12.8','-n' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "CUDA installation failed: $($process.ExitCode)" }
          Remove-Item $cudaInstaller
          $cuda = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8'
          & "$cuda\bin\nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'CUDA compiler probe failed' }
          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          "CUDA_TOOLKIT_ROOT_DIR=$cuda" >> $env:GITHUB_ENV
          "$cuda\bin" >> $env:GITHUB_PATH

          # Use upstream's SDKCore MSI extraction, not AMD's full driver installer.
          # HIPRT, DPC++ and Level Zero come from the pinned Blender libs.
          # AMD lists 7.1.1 for Windows 11, not Server 2022: this compiler-only
          # installation still needs a native CI run; never fall back to 6.x/OFF.
          $hipInstaller = Join-Path $sdk 'hip.exe'
          Invoke-WebRequest 'https://download.amd.com/developer/eula/rocm-hub/AMD-Software-PRO-Edition-26.Q1-Win11-For-HIP.exe' -OutFile $hipInstaller
          Assert-VendorSignature $hipInstaller 'Advanced Micro Devices'
          7z x -y $hipInstaller "-o$sdk" 'Packages\Apps\ROCmSDKPackages\SDKCore\*'
          if ($LASTEXITCODE -ne 0) { throw 'HIP SDK extraction failed' }
          $hipMsi = Join-Path $sdk 'Packages\Apps\ROCmSDKPackages\SDKCore\ROCm_SDK_Core.msi'
          if (!(Test-Path $hipMsi)) { throw 'Upstream HIP SDKCore MSI layout changed' }
          $hip = 'C:\tools\rocm'
          New-Item -ItemType Directory -Force build/ci | Out-Null
          $log = Join-Path $env:GITHUB_WORKSPACE 'build\ci\hip-install.log'
          $process = Start-Process msiexec.exe -ArgumentList '/i',"`"$hipMsi`"",'/qn','/norestart',"INSTALLDIR=`"$hip`"",'/L*v',"`"$log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "HIP SDK installation failed: $($process.ExitCode); see $log" }
          Remove-Item $sdk -Recurse -Force
          $env:HIP_PATH = $hip
          & "$hip\bin\hipcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'HIP compiler probe failed' }
          $hipVersion = Get-Content "$hip\include\hip\hip_version.h" -Raw
          if ($hipVersion -notmatch '#define HIP_VERSION_MAJOR\s+7\b' -or
              $hipVersion -notmatch '#define HIP_VERSION_MINOR\s+1\b') {
            throw 'HIP SDK version does not match upstream 7.1'
          }
          "HIP_PATH=$hip" >> $env:GITHUB_ENV
          "HIP_ROOT_DIR=$hip" >> $env:GITHUB_ENV
          "$hip\bin" >> $env:GITHUB_PATH
          foreach ($file in @('dpcpp/bin/clang++.exe', 'level-zero/lib/ze_loader.lib',
                              'level-zero/include/level_zero/ze_api.h', 'hiprt/include/hiprt/hiprt.h',
                              'hiprt/bin/hiprt0200564.lib')) {
            if (!(Test-Path "lib/windows_x64/$file")) { throw "Pinned GPU dependency missing: $file" }
          }
          & lib/windows_x64/dpcpp/bin/clang++.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned DPC++ compiler probe failed' }
          # Windows libraries do not bundle ocloc. Blender's GPU build handbook
          # requires Intel's standalone Offline Compiler, not a replacement SYCL
          # SDK. Keep its companion IGC DLLs and license files together.
          # https://www.intel.com/content/www/us/en/developer/articles/tool/oneapi-standalone-components.html
          $oclocZip = Join-Path $env:RUNNER_TEMP 'ocloc.zip'
          Invoke-WebRequest 'https://registrationcenter-download.intel.com/akdlm/IRC_NAS/afea9409-dd07-4a3c-8f04-bf51fdd7b480/w_ocloc_p_2026.1.1.zip' -OutFile $oclocZip
          if ((Get-FileHash $oclocZip -Algorithm SHA256).Hash -ne '59a2a804dbb75a30a0cfec75f6282f8fb15522e45579d83c3ec975012d278b3b') {
            throw 'Intel ocloc archive checksum mismatch'
          }
          Expand-Archive $oclocZip "$env:RUNNER_TEMP/ocloc"
          Remove-Item $oclocZip
          $ocloc = "$env:RUNNER_TEMP/ocloc/bin"
          & "$ocloc/ocloc.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Intel ocloc probe failed' }
          "OCLOC_INSTALL_DIR=$ocloc" >> $env:GITHUB_ENV
          # NVIDIA's public headers are sufficient; no authenticated OptiX SDK
          # installer or GPU driver is required. Pin OptiX 9.0.0, not moving main.
          git clone --no-checkout https://github.com/NVIDIA/optix-dev.git "$env:RUNNER_TEMP/optix"
          if ($LASTEXITCODE -ne 0) { throw 'OptiX download failed' }
          git -C "$env:RUNNER_TEMP/optix" checkout --detach fff65c2a7c592f1ea5f1661ad7d2381cf965f9bd
          if ($LASTEXITCODE -ne 0) { throw 'OptiX checkout failed' }
          "OPTIX_ROOT_DIR=$env:RUNNER_TEMP/optix" >> $env:GITHUB_ENV
      - &mesa-cache
        uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: .cache/mesa/mesa3d-25.0.7-release-msvc.7z
          key: mesa-windows-x64-25.0.7-e81be9e5990fabc5e528f544b1a2e2f37f70fe098822eb9c70555501f3621287
      - &mesa-install
        name: Windows software Vulkan ICD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = '.cache\mesa\mesa3d-25.0.7-release-msvc.7z'
          New-Item -ItemType Directory -Force '.cache\mesa' | Out-Null
          if (!(Test-Path $archive)) {
            Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/25.0.7/mesa3d-25.0.7-release-msvc.7z' -OutFile $archive
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'e81be9e5990fabc5e528f544b1a2e2f37f70fe098822eb9c70555501f3621287') {
            throw 'Mesa archive checksum mismatch'
          }
          7z x -y $archive '-o.cache\mesa\25.0.7' 'x64\lvp_icd.x86_64.json' 'x64\vulkan_lvp.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $icd = (Resolve-Path '.cache\mesa\25.0.7\x64\lvp_icd.x86_64.json').Path
          $dll = Join-Path (Split-Path $icd) 'vulkan_lvp.dll'
          Get-Item $icd, $dll | Select-Object FullName, Length
          Get-Content $icd
          # Elevated Windows processes ignore VK_DRIVER_FILES. Register the software
          # ICD on this disposable runner, with native paths for relative DLL lookup.
          reg.exe add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v $icd /t REG_DWORD /d 0 /f /reg:64
          if ($LASTEXITCODE -ne 0) { throw 'Mesa ICD registration failed' }
          Write-Output 'DEVICE_EVIDENCE: Windows x64 / Mesa 25.0.7 lavapipe (software Vulkan, not Windows 11 GPU hardware)'
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .cache/sccache
          key: compiler-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}-${{ inputs.full && 'full' || 'gate' }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}-full-
            compiler-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}-
      - name: Configure
        run: |
          extra=()
          if [[ "$RUNNER_OS" = Windows ]]; then
            extra+=(-DWITH_WINDOWS_SCCACHE=ON "-DOCLOC_INSTALL_DIR:PATH=$OCLOC_INSTALL_DIR")
            # Pinned Windows libraries name this directory level-zero, while
            # platform_win32.cmake's default root currently uses level_zero.
            extra+=("-DLEVEL_ZERO_INCLUDE_DIR:PATH=$GITHUB_WORKSPACE/lib/windows_x64/level-zero/include")
            extra+=("-DLEVEL_ZERO_LIBRARY:FILEPATH=$GITHUB_WORKSPACE/lib/windows_x64/level-zero/lib/ze_loader.lib")
          fi
          if [[ "$RUNNER_OS" = macOS ]]; then extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64); fi
          cmake -S . -B build/ci -G Ninja -C build_files/cmake/config/blender_agent.cmake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_OPTIMIZE_DEPENDENCIES=ON \
            -DAGENT_WARNINGS_AS_ERRORS=ON "${extra[@]}"
      - name: Verify generated Windows GPU build graph
        if: runner.os == 'Windows'
        run: |
          # CMake can shadow ON cache entries with OFF when discovery fails.
          # Require real generated AOT targets and compiled device definitions.
          for backend in cuda optix hip hiprt oneapi; do
            ninja -C build/ci -t query "cycles_kernel_$backend"
          done
          for define in WITH_CUDA WITH_OPTIX WITH_HIP WITH_HIPRT WITH_ONEAPI; do
            grep -Eq "[/-]D${define}([ =]|$)" build/ci/build.ninja || {
              echo "Missing compiled Cycles device: $define" >&2
              exit 1
            }
          done
          echo WINDOWS_GPU_BUILD_GRAPH_OK
      - name: Gate targets
        if: '!inputs.full && runner.os != ''Linux'''
        run: |
          ninja -C build/ci -t query bf_agent
          ninja -C build/ci -t query blender-cli
          cmake --build build/ci --target bf_agent blender-cli --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
          echo 'GATE_TARGETS_OK: bf_agent blender-cli'
      - name: Full build and install
        id: install
        if: inputs.full || runner.os == 'Linux'
        run: |
          cmake --build build/ci --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
          cmake --install build/ci
          echo BUILD_EXIT=0
      - name: Verify Windows ICD through the installed Vulkan loader
        if: inputs.full && runner.os == 'Windows'
        env:
          VK_LOADER_DEBUG: all
        run: python3 tests/agent/gpu.py build/ci/bin/blender-cli.exe
      - name: Protocol tests
        if: inputs.full || runner.os == 'Linux'
        # 34147274931: installed suite 102 min; >=2x measured harness budget.
        timeout-minutes: 240
        run: ctest --test-dir build/ci -R agent --output-on-failure
      - name: Compress install handoff
        if: '!cancelled() && steps.install.outcome == ''success'''
        run: |
          # One gzip stream preserves macOS symlinks/modes and avoids uploading
          # the ~770 MB install as individually compressed artifact files.
          tar -czf build/install.tar.gz -C build/ci bin
      - uses: actions/upload-artifact@v4
        if: '!cancelled() && steps.install.outcome == ''success'''
        with:
          name: install-${{ matrix.platform }}
          compression-level: 0
          if-no-files-found: error
          path: build/install.tar.gz
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ inputs.full && 'full' || 'gate' }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/hip-install.log
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Testing/Temporary/LastTestsFailed.log
  package:
    name: ${{ matrix.platform }} / package
    needs: build
    if: '!cancelled() && (inputs.full || contains(inputs.platforms, ''linux_x64''))'
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.full && inputs.platforms || '["linux_x64"]') }}
    runs-on: ${{ matrix.platform == 'macos_arm64' && 'macos-15' || matrix.platform == 'windows_x64' && 'windows-2022' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: install-${{ matrix.platform }}
          path: build
      - name: Restore install
        run: |
          mkdir -p build/ci
          tar -xzf build/install.tar.gz -C build/ci
      - name: Package prerequisites
        run: |
          if [[ "$RUNNER_OS" = macOS ]]; then brew install zstd; fi
          if [[ "$RUNNER_OS" = Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y mesa-vulkan-drivers zstd
          fi
      - *mesa-cache
      - *mesa-install
      - name: Trim, archive and verify installed package
        id: package
        # 34147274931: ~126 min including duplicate IO, >=2x even before
        # removing that duplicate. A separate job gives this step its budget.
        timeout-minutes: 300
        run: |
          platform='${{ matrix.platform }}'
          platform="${platform/_/-}"
          python3 source/blender/agent/packaging/package.py build/ci/bin build/release \
            --platform "$platform" --archive
          original=build/ci/bin/blender-cli
          trimmed=build/release/blender-cli
          if [[ "$RUNNER_OS" = macOS ]]; then original=build/ci/bin/Blender.app/Contents/MacOS/blender-cli; fi
          if [[ "$RUNNER_OS" = Windows ]]; then original+=.exe; trimmed+=.exe; fi
          set +e
          python3 tests/agent/package.py "$original" "$trimmed"
          status=$?
          set -e
          if [[ "$status" = 77 ]]; then
            echo '::warning::Package GPU checks skipped; see native device reason above. Not rendering evidence.'
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
          failed=0
          # CMake owns the suite: derive scripts from its test registrations so
          # a newly registered test cannot disappear from trimmed verification.
          tests=$(sed -n 's@.*"${CMAKE_CURRENT_SOURCE_DIR}/\([^"]*\.py\)".*@\1@p' tests/agent/CMakeLists.txt)
          test -n "$tests"
          for script in $tests; do
            test="${script%.py}"
            set +e
            python3 "tests/agent/$script" "$trimmed"
            status=$?
            set -e
            echo "PACKAGE_TEST: $test exit=$status"
            if [[ "$status" = 77 ]]; then
              echo "::warning::Package $test skipped: not rendering evidence."
            elif [[ "$status" != 0 ]]; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: '!cancelled() && steps.package.outcome == ''success'''
        with:
          name: package-${{ matrix.platform }}
          compression-level: 0
          if-no-files-found: error
          path: |
            build/blender-cli-*.tar.zst
            build/blender-cli-*.zip
            build/release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.platform }}-package
          path: build/release.json
