name: Agent build implementation
on:
  workflow_call:
    inputs:
      full:
        required: true
        type: boolean
      platforms:
        type: string
        default: '["macos_arm64","windows_x64","linux_x64"]'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ inputs.full && 'full' || 'gate' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.platform == 'macos_arm64' && 'macos-15' || matrix.platform == 'windows_x64' && 'windows-2022' || 'ubuntu-24.04' }}
    defaults:
      run:
        shell: bash
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
      SCCACHE_CACHE_SIZE: 2G
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pinned library revision
        id: lib
        run: echo "revision=$(git rev-parse HEAD:lib/${{ matrix.platform }})" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            lib/${{ matrix.platform }}
            .git/modules/lib/${{ matrix.platform }}
          key: libraries-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}
      - name: Fetch upstream assets and pinned libraries
        run: |
          git lfs install --local
          git config remote.lfs-fallback.url https://projects.blender.org/blender/blender.git
          git config remote.lfs-fallback.pushurl no_push
          git lfs pull lfs-fallback
          git -c submodule.lib/${{ matrix.platform }}.update=checkout submodule update --init --depth 1 -- lib/${{ matrix.platform }}
          git -C lib/${{ matrix.platform }} lfs pull
          test "$(git -C lib/${{ matrix.platform }} rev-parse HEAD)" = '${{ steps.lib.outputs.revision }}'
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build libx11-dev libxxf86vm-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libwayland-dev wayland-protocols libdbus-1-dev libgl-dev libegl-dev mesa-vulkan-drivers zstd
          echo CC=gcc-14 >> "$GITHUB_ENV"
          echo CXX=g++-14 >> "$GITHUB_ENV"
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          brew install ninja zstd
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/cache@v4
        if: inputs.full && runner.os == 'Windows'
        with:
          path: .cache/mesa/mesa3d-25.0.7-release-msvc.7z
          key: mesa-windows-x64-25.0.7-e81be9e5990fabc5e528f544b1a2e2f37f70fe098822eb9c70555501f3621287
      - name: Windows software Vulkan ICD
        if: inputs.full && runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = '.cache\mesa\mesa3d-25.0.7-release-msvc.7z'
          New-Item -ItemType Directory -Force '.cache\mesa' | Out-Null
          if (!(Test-Path $archive)) {
            Invoke-WebRequest 'https://github.com/pal1000/mesa-dist-win/releases/download/25.0.7/mesa3d-25.0.7-release-msvc.7z' -OutFile $archive
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'e81be9e5990fabc5e528f544b1a2e2f37f70fe098822eb9c70555501f3621287') {
            throw 'Mesa archive checksum mismatch'
          }
          7z x -y $archive '-o.cache\mesa\25.0.7' 'x64\lvp_icd.x86_64.json' 'x64\vulkan_lvp.dll'
          if ($LASTEXITCODE -ne 0) { throw 'Mesa extraction failed' }
          $icd = (Resolve-Path '.cache\mesa\25.0.7\x64\lvp_icd.x86_64.json').Path
          $dll = Join-Path (Split-Path $icd) 'vulkan_lvp.dll'
          Get-Item $icd, $dll | Select-Object FullName, Length
          Get-Content $icd
          # Elevated Windows processes ignore VK_DRIVER_FILES. Register the software
          # ICD on this disposable runner, with native paths for relative DLL lookup.
          reg.exe add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v $icd /t REG_DWORD /d 0 /f /reg:64
          if ($LASTEXITCODE -ne 0) { throw 'Mesa ICD registration failed' }
          Write-Output 'DEVICE_EVIDENCE: Windows x64 / Mesa 25.0.7 lavapipe (software Vulkan, not Windows 11 GPU hardware)'
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: actions/cache/restore@v4
        id: compiler-cache
        with:
          path: .cache/sccache
          key: compiler-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}-${{ inputs.full && 'full' || 'gate' }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            compiler-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}-full-
            compiler-${{ matrix.platform }}-${{ steps.lib.outputs.revision }}-
      - name: Configure
        run: |
          extra=()
          if [[ "$RUNNER_OS" = Windows ]]; then extra+=(-DWITH_WINDOWS_SCCACHE=ON); fi
          if [[ "$RUNNER_OS" = macOS ]]; then extra+=(-DCMAKE_OSX_ARCHITECTURES=arm64); fi
          cmake -S . -B build/ci -G Ninja -C build_files/cmake/config/blender_agent.cmake \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_OPTIMIZE_DEPENDENCIES=ON \
            -DAGENT_WARNINGS_AS_ERRORS=ON "${extra[@]}"
      - name: Gate targets
        if: '!inputs.full && runner.os != ''Linux'''
        run: |
          ninja -C build/ci -t query bf_agent
          ninja -C build/ci -t query blender-cli
          cmake --build build/ci --target bf_agent blender-cli --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
          echo 'GATE_TARGETS_OK: bf_agent blender-cli'
      - name: Full build and install
        id: install
        if: inputs.full || runner.os == 'Linux'
        run: |
          cmake --build build/ci --parallel ${{ runner.os == 'macOS' && 3 || 4 }}
          cmake --install build/ci
          echo BUILD_EXIT=0
      - name: Verify Windows ICD through the installed Vulkan loader
        if: inputs.full && runner.os == 'Windows'
        env:
          VK_LOADER_DEBUG: all
        run: python3 tests/agent/gpu.py build/ci/bin/blender-cli.exe
      - name: Protocol tests
        if: inputs.full || runner.os == 'Linux'
        timeout-minutes: 120
        run: ctest --test-dir build/ci -R agent --output-on-failure
      - name: Trim, archive and verify installed package
        id: package
        if: '!cancelled() && steps.install.outcome == ''success'''
        # Nine scripts plus IO package smoke exceed 120 minutes on lavapipe:
        # run 34147274931 reached the final script before the aggregate cutoff.
        timeout-minutes: 180
        run: |
          platform='${{ matrix.platform }}'
          platform="${platform/_/-}"
          python3 source/blender/agent/packaging/package.py build/ci/bin build/release \
            --platform "$platform" --archive
          original=build/ci/bin/blender-cli
          trimmed=build/release/blender-cli
          if [[ "$RUNNER_OS" = macOS ]]; then original=build/ci/bin/Blender.app/Contents/MacOS/blender-cli; fi
          if [[ "$RUNNER_OS" = Windows ]]; then original+=.exe; trimmed+=.exe; fi
          set +e
          python3 tests/agent/package.py "$original" "$trimmed"
          status=$?
          set -e
          if [[ "$status" = 77 ]]; then
            echo '::warning::Package GPU checks skipped; see native device reason above. Not rendering evidence.'
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi
          failed=0
          # CMake owns the suite: derive scripts from its test registrations so
          # a newly registered test cannot disappear from trimmed verification.
          tests=$(sed -n 's@.*"${CMAKE_CURRENT_SOURCE_DIR}/\([^"]*\.py\)".*@\1@p' tests/agent/CMakeLists.txt)
          test -n "$tests"
          for script in $tests; do
            test="${script%.py}"
            set +e
            python3 "tests/agent/$script" "$trimmed"
            status=$?
            set -e
            echo "PACKAGE_TEST: $test exit=$status"
            if [[ "$status" = 77 ]]; then
              echo "::warning::Package $test skipped: not rendering evidence."
            elif [[ "$status" != 0 ]]; then
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: '!cancelled() && steps.package.outcome == ''success'''
        with:
          name: package-${{ matrix.platform }}
          compression-level: 0
          if-no-files-found: error
          path: |
            build/blender-cli-*.tar.zst
            build/blender-cli-*.zip
            build/release.json
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.compiler-cache.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/sccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.platform }}-${{ inputs.full && 'full' || 'gate' }}
          path: |
            build/ci/CMakeCache.txt
            build/ci/Testing/Temporary/LastTest.log
            build/ci/Testing/Temporary/LastTestsFailed.log
            build/release.json
