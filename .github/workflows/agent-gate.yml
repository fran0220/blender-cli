name: Agent gate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    uses: ./.github/workflows/agent-build.yml
    with:
      full: false
